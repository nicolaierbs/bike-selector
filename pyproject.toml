[project]
name = "bike-selector"
version = "0.1.0"
description = "Auto-assign the right bike to new Strava rides using an XGBoost classifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stravalib>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "xgboost>=2.1",
    "scikit-learn>=1.5",  # required by xgboost's XGBClassifier wrapper
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
bike-selector = "bike_selector.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_selector"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
