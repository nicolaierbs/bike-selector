services:
  - type: web
    name: bike-selector
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn bike_selector.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Keep xgboost/numpy single-threaded: the free plan has one shared vCPU and
      # BLAS thread pools are a common cause of memory blow-ups there.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: STATE_DIR
        value: /tmp/bike-selector
      - key: PUBLIC_BASE_URL
        value: https://bike-selector.onrender.com
      - key: KEEPALIVE_MINUTES
        value: "10"
      # --- set these in the Render dashboard, not here ---
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REFRESH_TOKEN
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WEBHOOK_PATH_SECRET
        sync: false
